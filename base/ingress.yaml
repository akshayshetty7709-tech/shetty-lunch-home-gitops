apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slh-ingress
  labels:
    app.kubernetes.io/part-of: shetty-lunch-home
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: shettylunchhome.local # replaced per environment by the overlays
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
