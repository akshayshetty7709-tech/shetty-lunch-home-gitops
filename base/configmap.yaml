apiVersion: v1
kind: ConfigMap
metadata:
  name: slh-config
  labels:
    app.kubernetes.io/part-of: shetty-lunch-home
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  RESTAURANT_SERVICE_URL: http://restaurant-service:3002
  PAYMENT_SERVICE_URL: http://payment-service:3004
---
# Runs once, the first time the Postgres volume is initialised (docker-entrypoint-initdb.d).
# One database per microservice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    app.kubernetes.io/part-of: shetty-lunch-home
data:
  init.sql: |
    CREATE DATABASE userdb;
    CREATE DATABASE restaurantdb;
    CREATE DATABASE orderdb;
    CREATE DATABASE paymentdb;
