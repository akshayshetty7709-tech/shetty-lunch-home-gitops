# REFERENCE ONLY (not used by the local practice setup and NOT tested here).
# Real-company variant of platform/cluster-secret-store.yaml: AWS Secrets Manager instead of Vault.
# Authentication uses IRSA (IAM Roles for Service Accounts): no static token, no "secret zero" in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend          # keep the SAME name so the ExternalSecrets in overlays/ work unchanged
spec:
  conditions:
    - namespaces: [slh-dev, slh-staging, slh-prod]
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets            # the operator's ServiceAccount, annotated with the IAM role ARN
            namespace: external-secrets
