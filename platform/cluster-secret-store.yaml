# PLATFORM layer (owned by the platform/security team in a real company, installed once - not by app teams).
# Tells External Secrets Operator HOW to reach the secret backend. App teams only write ExternalSecret
# objects (see overlays/*/external-secret.yaml) that say WHICH secret to fetch.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  # Guard rail: only these namespaces may use this store. Without it, ANY namespace in the cluster
  # could read ANY path the token allows.
  conditions:
    - namespaces:
        - slh-dev
        - slh-staging
        - slh-prod
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"   # the KV mount; ExternalSecret keys are relative to it (key "slh/dev" = secret/slh/dev)
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
