# Says WHICH secret to fetch - never the value. External Secrets Operator reads Vault path
# "secret/slh/staging" and creates/refreshes the Kubernetes Secret "slh-secrets" in namespace slh-staging
# (keys DB_USER, DB_PASSWORD, JWT_SECRET). Deployments consume it exactly as before.
# The explicit default fields below stop ArgoCD showing a permanent OutOfSync (the operator fills them in otherwise).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slh-secrets
  labels:
    app.kubernetes.io/part-of: shetty-lunch-home
spec:
  refreshInterval: 5m   # how often ESO re-reads the vault; rotation in the vault reaches the cluster within this time
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: slh-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: slh/staging
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
