apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slh-dev

resources:
  - ../../base
  - external-secret.yaml

labels:
  - pairs:
      environment: dev

# CI (app repo) rewrites the tag line of every image below on each merge to main.
# Keep exactly one tag line per image and do not reformat these lines.
images:
  - name: ghcr.io/akshayshetty7709-tech/slh-user-service
    newTag: latest
  - name: ghcr.io/akshayshetty7709-tech/slh-restaurant-service
    newTag: latest
  - name: ghcr.io/akshayshetty7709-tech/slh-order-service
    newTag: latest
  - name: ghcr.io/akshayshetty7709-tech/slh-payment-service
    newTag: latest
  - name: ghcr.io/akshayshetty7709-tech/slh-frontend
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: slh-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.shettylunchhome.local
